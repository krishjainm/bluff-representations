[project]
name = "deception-llms"
version = "0.1.0"
description = "Research infrastructure for leakage-aware experiments on bluff-like behavior in language models."
readme = "README.md"
requires-python = ">=3.10.13"
dependencies = [
    "datasets>=4.5.0",
    "matplotlib>=3.10.8",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "openai>=2.15.0",
    "pandas>=2.3.3",
    "plotly>=6.5.2",
    "psutil>=7.2.1",
    # SentencePiece-based tokenizers (Mistral, Llama) need these; transformers
    # raises ImportError at tokenizer load without them.
    "protobuf>=4.25",
    "sentencepiece>=0.2.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "transformers>=4.57.6",
]

[project.scripts]
deception-paper = "deception_circuits.paper_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]