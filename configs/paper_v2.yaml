# Copy this file and replace every path/model field for a real run.
experiment_name: poker_predecision_v2
dataset_path: data/poker_v2.csv
activation_dir: data/activations/poker_v2_prompt_end
output_dir: results/poker_predecision_v2
seed: 2026
# split_manifest_path: results/poker_predecision_v2/split_manifest.json
group_column: split_group_id
# grouped_stratified balances the label across partitions while keeping groups
# intact; grouped_random is the group-only strategy, kept for comparison.
split_strategy: grouped_stratified
# Extra columns are dropped automatically if a stratum would have too few groups.
stratify_columns: [label]
test_fraction: 0.20
validation_fraction: 0.10
probe_c: 1.0
n_seeds: 5
bootstrap_resamples: 1000
# Learning curve: training-set sizes in *groups* (hands), each evaluated over
# `learning_curve_subsamples` independent draws. Empty list disables it.
learning_curve_sizes: []
learning_curve_subsamples: 5
# --- extraction: these fields now constrain `collect-activations` and are
# --- checked against the artifact manifest before probes can read them.
# residual_stream == decoder block output; also accepts attn | mlp.
activation_site: residual_stream
# prompt_end | decision_token_prelogit | mean_prompt are pre-decision (primary).
# response_token is a labelled diagnostic and will fail the audit as a primary.
activation_mode: prompt_end
subject_model: REPLACE_WITH_EXACT_MODEL_ID
model_revision: null
tokenizer_revision: null
# `all`, or an explicit list/space-or-comma separated string of layer indices.
activation_layers: all
# Leave null for pre-decision modes unless every prompt fits: truncation that
# would move the `Action:` boundary is refused rather than silently applied.
max_sequence_length: null
prompt_template_id: poker_action_v1
probe_type: logistic_regression
# --- SAE stage (train-sae). Unsupervised; labels only rank frozen features.
# n_features must be explicit: there is no "same as input" default, because that
# is not an overcomplete dictionary. Record the expansion factor you intend.
# Example: {n_features: 8192, activation: topk, k: 32, epochs: 100, seed: 0}
sae_config: {}
sae_top_n_features: 5
# Two or more seeds enables dictionary-stability reporting; empty skips it.
sae_stability_seeds: []
# --- causal intervention stage (run-interventions) ---
# Direction is fitted on the train partition at the validation-selected layer.
steering_direction_source: probe_train_partition
# null = reuse the modal validation-selected layer from probe_results.json.
intervention_layer: null
intervention_site: block
intervention_token_policy: prompt_end
# Dose-response grid, in units of the unit-norm direction. Empty disables the stage.
intervention_strengths: []
# Held-out prompts to evaluate. Configurable: the reviewers objected to n=100.
causal_eval_size: 300
# The primary endpoint is the model's own answer distribution, never the probe
# score. For the bluff-judgement dataset these are the allowed answer tokens.
endpoint_options: []
endpoint_positive_option: null
# Optional: build a nuisance steering direction from this column for comparison.
causal_nuisance_column: null
decoding_settings: {}
# E.g. [action, street, position, hand_strength, board_texture, bet_size]
nuisance_columns: []
